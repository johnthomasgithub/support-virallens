version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: virallens-server
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - ./server/.env
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${CLIENT_VITE_API_URL:-http://localhost:5000}
    container_name: virallens-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:80"
    depends_on:
      - server
    networks:
      - app-network

  mongo:
    image: mongo:7.0
    container_name: virallens-mongo
    restart: unless-stopped
    profiles:
      - local-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:

