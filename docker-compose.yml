# Full stack: MongoDB + Express API + React (nginx).
#   docker compose up --build
# App:    http://localhost:5173
# API:    http://localhost:5000
#
# Uses the bundled MongoDB by default. To use MongoDB Atlas instead, set
# MONGODB_URI in a root-level .env file (or your shell) before running compose.

services:
  mongo:
    image: mongo:7.0
    container_name: lumi-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ./server
    container_name: lumi-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # Container-specific values override server/.env
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/ai-support-agent}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    ports:
      - '5000:5000'
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        # Baked into the static bundle at build time; the browser calls the API directly
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: lumi-client
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo_data:
